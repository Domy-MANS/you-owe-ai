* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0b0b10; color: var(--fg); font-family: var(--font); overflow: hidden; -webkit-font-smoothing: antialiased; }

#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.slide {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
  padding: 64px max(16px, calc(50vw - 300px)) 48px; opacity: 0; pointer-events: none;
  transition: opacity 0.5s ease; overflow: hidden;
}
.slide.on { opacity: 1; pointer-events: auto; }
.slide::before { content: ""; position: absolute; inset: -20%; z-index: -1; background: var(--bg); filter: saturate(1.1); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { from { transform: rotate(0deg) scale(1); } to { transform: rotate(8deg) scale(1.1); } }

.bars { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 10; }
.bars i { flex: 1; height: 3px; border-radius: 2px; background: var(--faint); overflow: hidden; }
.bars i b { display: block; height: 100%; width: 0; background: #fff; }
.bars i.done b { width: 100%; }
.bars i.now b { animation: fill var(--dur, 7s) linear forwards; }
@keyframes fill { to { width: 100%; } }

.top { position: fixed; top: 24px; right: 16px; z-index: 11; display: flex; gap: 8px; }
.chip { font: 600 12px var(--font); color: #fff; background: rgba(0,0,0,0.28); border: 1px solid var(--faint); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip:hover { background: rgba(0,0,0,0.45); }

.kicker { font: 600 15px var(--font); letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin-bottom: 14px; }
h1 { font-size: clamp(34px, 7vw, 56px); line-height: 1.12; font-weight: 800; letter-spacing: -0.02em; }
.big { font-size: clamp(64px, 18vw, 132px); font-weight: 900; line-height: 1; letter-spacing: -0.04em; margin: 10px 0 6px; font-variant-numeric: tabular-nums; }
.unit { font-size: clamp(22px, 5vw, 32px); font-weight: 700; }
.sub { font-size: clamp(16px, 3.6vw, 20px); color: var(--dim); line-height: 1.5; margin-top: 14px; }
.sub b { color: #fff; }

.pop > * { opacity: 0; transform: translateY(18px); }
.slide.on .pop > * { animation: up 0.6s cubic-bezier(.2,.8,.2,1) forwards; }
.slide.on .pop > *:nth-child(2) { animation-delay: 0.15s; }
.slide.on .pop > *:nth-child(3) { animation-delay: 0.3s; }
.slide.on .pop > *:nth-child(4) { animation-delay: 0.45s; }
.slide.on .pop > *:nth-child(5) { animation-delay: 0.6s; }
.slide.on .pop > *:nth-child(6) { animation-delay: 0.75s; }
@keyframes up { to { opacity: 1; transform: none; } }

.split { display: flex; height: 64px; border-radius: 16px; overflow: hidden; margin: 28px 0 12px; background: var(--faint); }
.split div { display: flex; align-items: center; padding: 0 16px; font-weight: 800; font-size: 18px; white-space: nowrap; width: 0; transition: width 1.2s cubic-bezier(.2,.8,.2,1) 0.3s; }
.split .c { background: #f4a35c; color: #2a1405; }
.split .x { background: #111; color: #fff; justify-content: flex-end; }
.legend { display: flex; justify-content: space-between; color: var(--dim); font-size: 15px; }

.rows { margin-top: 26px; display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 12px; font-size: 18px; }
.row .n { font: 800 18px var(--mono); color: var(--dim); }
.row .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .v { font: 600 16px var(--mono); color: var(--dim); }
.meter { grid-column: 2 / 4; height: 8px; border-radius: 4px; background: var(--faint); overflow: hidden; margin-top: -6px; }
.meter b { display: block; height: 100%; background: #fff; width: 0; transition: width 1s cubic-bezier(.2,.8,.2,1) 0.4s; }

.clock { display: flex; align-items: flex-end; gap: 3px; height: 160px; margin-top: 28px; }
.clock i { flex: 1; background: rgba(255,255,255,0.35); border-radius: 3px 3px 0 0; height: 2px; transition: height 0.9s cubic-bezier(.2,.8,.2,1); }
.clock i.peak { background: #fff; }
.clock-axis { display: flex; justify-content: space-between; color: var(--dim); font: 12px var(--mono); margin-top: 6px; }

.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 2px; margin-top: 26px; width: 100%; aspect-ratio: 53 / 7; }
.heat i { border-radius: 2px; background: rgba(255,255,255,0.1); }
.heat i.l1 { background: rgba(255,255,255,0.35); } .heat i.l2 { background: rgba(255,255,255,0.6); }
.heat i.l3 { background: rgba(255,255,255,0.85); } .heat i.l4 { background: #fff; }
.heat i.out { visibility: hidden; }

.persona-emoji { font-size: 84px; line-height: 1; margin-bottom: 12px; }
canvas#card { width: min(100%, 360px); aspect-ratio: 4 / 5; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.45); align-self: center; }
.actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.btn { font: 700 15px var(--font); border-radius: 999px; padding: 12px 20px; border: 0; cursor: pointer; background: #fff; color: #111; }
.btn.ghost { background: rgba(0,0,0,0.3); color: #fff; border: 1px solid var(--faint); }
.hint { position: fixed; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--dim); z-index: 10; }
.privacy { font-size: 13px; color: var(--dim); margin-top: 24px; }
@media (prefers-reduced-motion: reduce) { .slide::before, .bars i.now b { animation: none; } }

/* screenshot mode: everything in its final state */
.still .pop > *, .still .slide.on .pop > * { opacity: 1; transform: none; animation: none; }
.still .split div, .still .meter b, .still .clock i { transition: none; }
.still .slide::before { animation: none; }

.vs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 24px; }
.vs-cell { border-radius: 16px; padding: 16px; background: rgba(0,0,0,0.22); }
.vs-cell.ai { background: rgba(255,255,255,0.14); }
.vs-n { font-size: clamp(34px, 9vw, 52px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.vs-l { font-size: 14px; color: var(--dim); margin-top: 8px; line-height: 1.35; }
.quotes { display: grid; gap: 10px; margin-top: 18px; }
.quote { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: clamp(20px, 5vw, 26px); font-weight: 700; }
.quote span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quote b { font: 800 18px var(--mono); color: var(--dim); flex: none; }
.quote.first { font-size: clamp(30px, 8vw, 44px); font-weight: 900; }
.quote.first b { color: #fff; font-size: 24px; }
h1.mood { font-size: clamp(26px, 6vw, 40px); line-height: 1.3; }
.roast-line { font-size: clamp(18px, 4.4vw, 23px); font-weight: 700; line-height: 1.45; margin-top: 14px; }

#landing {
  position: fixed; inset: 0; z-index: 50; overflow-y: auto;
  background: linear-gradient(135deg, #ff6a3d, #ff2e88 55%, #7a2cff);
  display: flex; justify-content: center;
}
body:not(.playing) .bars, body:not(.playing) .top, body:not(.playing) .hint { display: none; }
.land { width: 100%; max-width: 520px; padding: 72px 16px 48px; display: flex; flex-direction: column; }
.land h1 { font-size: clamp(36px, 9vw, 56px); margin-bottom: 28px; }
.steps { display: grid; gap: 8px; margin-bottom: 20px; }
.pick {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  font: 700 18px var(--font); color: #fff; background: rgba(0,0,0,0.28);
  border: 1px solid rgba(255,255,255,0.25); border-radius: 16px; padding: 18px; cursor: pointer;
}
.pick:hover { background: rgba(0,0,0,0.4); }
.pick.done { background: rgba(255,255,255,0.18); border-color: #fff; }
.pick .ico { font-size: 24px; }
.st { font-size: 14px; min-height: 20px; padding: 0 6px 6px; color: var(--dim); }
.st.ok { color: #fff; font-weight: 700; }
.st.bad { color: #ffe08a; }
.where { font-size: 14px; color: var(--dim); line-height: 1.6; margin-top: 6px; }
kbd { font: 600 12px var(--mono); background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; padding: 1px 6px; }
.btn.go { padding: 16px; font-size: 18px; margin-bottom: 10px; }
.btn.go:disabled { opacity: 0.45; cursor: not-allowed; }
.land .btn.ghost { padding: 14px; }
.land .privacy { line-height: 1.6; }
.cli { font-size: 13px; color: var(--dim); margin-top: 14px; }
code { font: 600 13px var(--mono); background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 6px; }
.chip.lang { position: fixed; top: 16px; right: 16px; z-index: 60; }

 * Log parsing that runs in both Node and the browser.
 * Input is already-read files: [{ path, records: [...parsed JSON lines] }].
 * Output is numbers only (plus prompt text for the roast, which never leaves the page).

  shell: ["Bash", "exec", "shell", "local_shell", "exec_command", "write_stdin", "BashOutput", "KillShell", "Monitor"],
  edit: ["Edit", "Write", "MultiEdit", "NotebookEdit", "apply_patch"],

  web: ["WebSearch", "WebFetch", "web_search", "web_fetch"],
  agents: ["Agent", "Task", "spawn_agent", "SendMessage"],
};

// polling / bookkeeping calls that aren't real work

function categoryOf(tool) {
  for (const [cat, names] of Object.entries(CATEGORIES)) if (names.includes(tool)) return cat;
  if (/^mcp__/.test(tool)) return "mcp";

const pad = (n) => String(n).padStart(2, "0");
function localDay(ts) {
  const d = new Date(ts);

function addTo(obj, key, n = 1) {
  obj[key] = (obj[key] || 0) + n;

function topN(obj, n) {
  return Object.entries(obj)
    .sort((a, b) => b[1] - a[1])
    .slice(0, n)

  { id: "dawn", test: (x) => x.dawnShare >= 0.3 },
  { id: "weekend", test: (x) => x.weekendShare >= 0.4 },
  { id: "dual", test: (x) => x.minToolShare >= 0.25 },
  { id: "terminal", test: (x) => x.cat.shell >= 0.5 },
  { id: "sculptor", test: (x) => x.cat.edit >= 0.35 },
  { id: "researcher", test: (x) => x.cat.web >= 0.15 },
  { id: "steady", test: () => true },
];

/**
 * Turn parsed sessions + prompts into the numbers the report shows.
 * Filters to `year` by local time.
 */
function computeStats({ sessions, prompts }, { year }) {
  const inYear = (ts) => new Date(ts).getFullYear() === year;

    if (s.project) addTo(projects, s.project, Math.max(1, s.prompts));

  }

  const hours = new Array(24).fill(0);
  const weekdays = new Array(7).fill(0);
  const days = {};
  for (const p of prompts) {
    const d = new Date(p.ts);
    hours[d.getHours()]++;
    weekdays[d.getDay()]++;
    addTo(days, localDay(p.ts));
    byTool[p.tool].prompts++;

  const dawnShare = share([5, 6, 7, 8].reduce((a, h) => a + hours[h], 0));

    empty: totalPrompts === 0 && sessions.length === 0,
    firstDay: Object.keys(days).sort()[0] || null,
    sessions: sessions.length,
    prompts: totalPrompts,
    workHours: workMs / 3600000,

  var PERSONAS = {

  var GRADS = [

  function t() { return T[lang]; }

  function fmt(n) {

  // ---------- slides ----------
  function slides() {
    var L = t(), out = [];

      add('<div class="pop"><div class="kicker">' + L.clockK + "</div><h1>" + L.clockH(D.peakHour) + '</h1><div><div class="clock">' + bars + '</div><div class="clock-axis"><span>0</span><span>6</span><span>12</span><span>18</span><span>23</span></div></div><div class="sub">' + L.clockS() + "</div></div>");

    if (D.topProjects.length) add(list(L.projK, D.topProjects));

    var R = D.roast;

      var cells = L.vs.map(function (x, i) { return '<div class="vs-cell ' + (i % 2 ? "ai" : "me") + '"><div class="vs-n">' + count(v[i]) + '</div><div class="vs-l">' + x[0] + "</div></div>"; }).join("");
      add('<div class="pop"><div class="kicker">' + L.vsK + "</div><h1>" + L.vsH + '</h1><div class="vs">' + cells + '</div><div class="sub">' + L.vsS(R) + "</div></div>");
      if (R.catchphrases.length) {

  function list(kicker, items) {
    var max = items[0].count;
    var rows = items.map(function (r, i) {

  function heat() {
    var start = new Date(D.year, 0, 1), cells = [], vals = [];

      var v = D.days[key] || 0;
      var lvl = !v ? "" : v <= q1 ? "l1" : v <= q2 ? "l2" : v <= q3 ? "l3" : "l4";

  // ---------- player ----------
  var stage = document.getElementById("stage"), barsEl = document.getElementById("bars");
  var list_ = [], idx = 0, timer = null;
  var still = /[?&]still\b/.test(location.search); // for screenshots: no autoplay

  function build() {

    stage.innerHTML = list_.map(function (s, i) { return '<section class="slide" style="--bg:' + GRADS[i % GRADS.length] + '">' + s.html + "</section>"; }).join("");
    barsEl.innerHTML = list_.map(function () { return "<i><b></b></i>"; }).join("");
    document.getElementById("lang").textContent = t().lang;
    document.getElementById("hint").textContent = t().next;
    var dl = document.getElementById("dl"), again = document.getElementById("again");

  }

  if (still) document.documentElement.classList.add("still");

  function animateIn(el) {

      var target = parseFloat(n.getAttribute("data-count")), t0 = performance.now(), dec = target % 1 ? 1 : 0;
      (function tick(now) {
        var p = Math.min(1, (now - t0) / 1400), e = 1 - Math.pow(1 - p, 3);

  function go(i) {

      secs[k].querySelectorAll("[data-h]").forEach(function (b) { if (k !== idx) b.style.height = "2px"; });
    }
    var bars = barsEl.children;
    for (var j = 0; j < bars.length; j++) {
      bars[j].className = j < idx ? "done" : "";
      bars[j].firstChild.style.animation = "none";
      void bars[j].offsetWidth;
      bars[j].firstChild.style.animation = "";

    try { localStorage.setItem("vw-lang", lang); } catch (e) {}

    var R = D.roast;
    var vals = R
      ? [fmt(D.prompts), fmt(R.you.deny), fmt(R.ai.sorry), String(D.activeDays), fmt(D.totalTokens), (R.latest ? R.latest.time : "-")]

    var labels = R ? L.cardFun : L.cardStats;
    for (var i = 0; i < 6; i++) {
      var cx = 72 + (i % 3) * 320, cy = 660 + Math.floor(i / 3) * 190;
      x.fillStyle = "rgba(0,0,0,0.22)"; round(x, cx, cy, 296, 166, 24); x.fill();
      x.fillStyle = "#fff"; x.font = "900 64px " + F; x.fillText(vals[i], cx + 26, cy + 26);
      x.font = "600 28px " + F; x.globalAlpha = 0.8; x.fillText(labels[i], cx + 26, cy + 112); x.globalAlpha = 1;
    }
    var hmax = Math.max.apply(null, D.hours) || 1, bw = (W - 144) / 24;
    for (var h = 0; h < 24; h++) {

      x.fillStyle = h === D.peakHour ? "#fff" : "rgba(255,255,255,0.45)";

    }

  }
  function round(x, a, b, w, h, r) { r = Math.min(r, w / 2, h / 2); x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }

};

    codex: function (rel) { return rel === "history.jsonl" ? "history" : /^(sessions|archived_sessions)\/.+\.jsonl$/.test(rel) ? "log" : null; },
  };
  var SUBDIRS = { claude: ["projects"], codex: ["sessions", "archived_sessions"] };

  async function walk(dir, prefix, out) {
    for await (var entry of dir.values()) {
      var rel = prefix + entry.name;
      if (entry.kind === "directory") await walk(entry, rel + "/", out);
      else if (/\.jsonl$/.test(entry.name)) out.push({ rel: rel, file: await entry.getFile() });
    }
  }

  /** File System Access API (Chrome, Edge): only walk the subfolders we need. */
  async function pickWithHandle(kind) {
    var dir = await window.showDirectoryPicker({ id: kind, mode: "read" });
    try { dir = await dir.getDirectoryHandle("." + kind); } catch (e) { /* picked the home folder? no: use as is */ }
    var out = [];
    if (dir.name === "projects" || dir.name === "sessions") { await walk(dir, dir.name + "/", out); return out; }
    try { out.push({ rel: "history.jsonl", file: await (await dir.getFileHandle("history.jsonl")).getFile() }); } catch (e) {}
    for (var i = 0; i < SUBDIRS[kind].length; i++) {
      try { await walk(await dir.getDirectoryHandle(SUBDIRS[kind][i]), SUBDIRS[kind][i] + "/", out); } catch (e) {}
    }
    return out;
  }

  /** Fallback (Safari, Firefox): <input webkitdirectory>. */
  function pickWithInput() {
    return new Promise(function (resolve) {
      var input = document.createElement("input");
      input.type = "file";
      input.webkitdirectory = true;
      input.multiple = true;
      input.onchange = function () {
        resolve(Array.prototype.map.call(input.files, function (f) {
          var parts = (f.webkitRelativePath || f.name).split("/");
          parts.shift(); // drop the picked folder's own name
          if (parts[0] === ".claude" || parts[0] === ".codex") parts.shift();
          return { rel: parts.join("/"), file: f };
        }));
      };
      input.click();
    });
  }

  async function pick(kind) {
    var btn = document.getElementById("pick-" + kind), status = document.getElementById("st-" + kind);
    var entries;
    try {
      entries = window.showDirectoryPicker ? await pickWithHandle(kind) : await pickWithInput();
    } catch (e) {
      if (e && e.name === "AbortError") return;
      status.textContent = String(e.message || e);
      return;
    }
    status.textContent = t().reading;
    var logs = [], history = [];
    for (var i = 0; i < entries.length; i++) {
      var role = WANT[kind](entries[i].rel);
      if (!role) continue;
      var records = VWParse.parseJsonl(await entries[i].file.text());
      if (role === "history") history = records;
      else logs.push({ path: entries[i].rel, records: records });
    }
    if (!logs.length && !history.length) {
      status.textContent = t().wrong(kind);
      status.className = "st bad";
      return;
    }
    S[kind] = { files: logs, history: history };
    status.textContent = t().files(logs.length + (history.length ? 1 : 0));
    status.className = "st ok";
    btn.classList.add("done");
    document.getElementById("go").disabled = false;
  }

  // ---------- compute + show ----------
  function makeStats() {
    var year = new Date().getFullYear();
    var c = S.claude || { files: [], history: [] }, x = S.codex || { files: [], history: [] };
    var cl = VWParse.parseClaude(c.files, c.history), cx = VWParse.parseCodex(x.files);
    var stats = VWStats.computeStats({ sessions: cl.sessions.concat(cx.sessions), prompts: cl.prompts.concat(cx.prompts) }, { year: year });
    stats.roast = VWRoast.computeRoast(VWParse.promptTexts(c.history, x.history), VWParse.replyTexts(c.files, x.files), { year: year });
    return stats;
  }

  function show(stats) {
    document.getElementById("landing").remove();
    document.body.classList.add("playing");
    window.VWReport(stats);
  }

  function render() {
    var L = t();
    document.getElementById("landing").innerHTML =
      '<button class="chip lang" id="l-lang">' + L.lang + "</button>" +
      '<div class="land">' +
      '<div class="kicker">' + L.sub + "</div>" +
      "<h1>" + L.title + "</h1>" +
      '<div class="steps">' +
      '<button class="pick" id="pick-claude"><span class="ico">🧡</span>' + L.pickClaude + '</button><div class="st" id="st-claude"></div>' +
      '<button class="pick" id="pick-codex"><span class="ico">🖤</span>' + L.pickCodex + '</button><div class="st" id="st-codex"></div>' +
      '<p class="where">' + L.where + "<br>" + L.onlyOne + "</p>" +
      "</div>" +
      '<button class="btn go" id="go" disabled>' + L.go + "</button>" +
      '<button class="btn ghost" id="demo">' + L.demo + "</button>" +
      '<p class="privacy">' + L.privacy + "</p>" +
      '<p class="cli">' + L.cli + " <code>npx vibe-wrapped</code></p>" +
      "</div>";
    document.getElementById("pick-claude").onclick = function () { pick("claude"); };
    document.getElementById("pick-codex").onclick = function () { pick("codex"); };
    document.getElementById("go").onclick = function () { show(makeStats()); };
    document.getElementById("demo").onclick = function () { show(window.VW_DEMO); };
    document.getElementById("l-lang").onclick = function () { lang = lang === "zh" ? "en" : "zh"; render(); };
  }

  if (/[?&]demo\b/.test(location.search)) show(window.VW_DEMO);
  else render();
})();
</script>
</body>
